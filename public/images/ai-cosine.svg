<svg xmlns="http://www.w3.org/2000/svg" width="760" height="440" viewBox="0 0 760 440" role="img" aria-labelledby="title"><title id="title">手工向量的余弦相似度演示</title><rect width="100%" height="100%" fill="#fbfcfa"/><style>text{font-family:system-ui,"PingFang SC","Microsoft YaHei",sans-serif;fill:#23352c} .t{font-size:22px;font-weight:600}.s{font-size:16px}.m{font-size:18px}</style><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#52705e" stroke-width="1.5"/></marker></defs><text x="40" y="44" class="t">余弦比较方向：二维几何演示</text><text x="40" y="76" class="s">手工设定坐标，并非真实文本模型输出</text><path d="M90 330 H700 M90 330 V105" fill="none" stroke="#a5b3a9" stroke-width="2"/><path d="M90 330 L450 330" stroke="#36734b" stroke-width="3"/><circle cx="450" cy="330" r="6" fill="#36734b"/><text x="390" y="365" class="m">A [2,0] · cos=1</text><path d="M90 330 L270 150" stroke="#a56c2c" stroke-width="3"/><circle cx="270" cy="150" r="6" fill="#a56c2c"/><text x="290" y="140" class="m">B [1,1] · cos≈0.707</text><path d="M90 330 L90 150" stroke="#5376a5" stroke-width="3"/><circle cx="90" cy="150" r="6" fill="#5376a5"/><text x="110" y="112" class="m">C [0,1] · cos=0</text><circle cx="270" cy="330" r="6" fill="#23352c"/><text x="185" y="305" class="m">查询 [1,0]</text><text x="40" y="410" class="s">A 与查询方向相同；B 倾斜；C 与查询正交。</text></svg>