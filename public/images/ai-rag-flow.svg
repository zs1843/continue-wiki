<svg xmlns="http://www.w3.org/2000/svg" width="770" height="540" viewBox="0 0 770 540" role="img" aria-labelledby="title"><title id="title">RAG资料准备检索与生成流程</title><rect width="100%" height="100%" fill="#fbfcfa"/><style>text{font-family:system-ui,"PingFang SC","Microsoft YaHei",sans-serif;fill:#23352c} .t{font-size:22px;font-weight:600}.s{font-size:16px}.m{font-size:18px}</style><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#52705e" stroke-width="1.5"/></marker></defs><text x="32" y="44" class="t">RAG：先准备资料，再检索并生成</text><text x="32" y="76" class="s">概念示意：向量帮助定位，原文提供证据</text><rect x="32" y="110" width="200" height="82" rx="10" fill="#eef4ed" stroke="#afc1b1"/><text x="47" y="140" class="m">资料与出处</text><text x="47" y="167" class="s">正文 · 章节 · 版本</text><rect x="282" y="110" width="200" height="82" rx="10" fill="#eef4ed" stroke="#afc1b1"/><text x="297" y="140" class="m">解析与切分</text><text x="297" y="167" class="s">片段 ID 对应原文</text><rect x="532" y="110" width="200" height="82" rx="10" fill="#eef4ed" stroke="#afc1b1"/><text x="547" y="140" class="m">建立检索索引</text><text x="547" y="167" class="s">保留片段与来源关联</text><path d="M232 151 L277 151" stroke="#52705e" stroke-width="2" marker-end="url(#arrow)"/><path d="M482 151 L527 151" stroke="#52705e" stroke-width="2" marker-end="url(#arrow)"/><rect x="32" y="270" width="200" height="82" rx="10" fill="#eef4ed" stroke="#afc1b1"/><text x="47" y="300" class="m">用户问题</text><text x="47" y="327" class="s">明确要查什么</text><rect x="282" y="270" width="200" height="82" rx="10" fill="#eef4ed" stroke="#afc1b1"/><text x="297" y="300" class="m">检索与重排</text><text x="297" y="327" class="s">取回相关正文片段</text><rect x="532" y="270" width="200" height="82" rx="10" fill="#eef4ed" stroke="#afc1b1"/><text x="547" y="300" class="m">组装上下文</text><text x="547" y="327" class="s">问题 + 材料 + 要求</text><path d="M232 311 L277 311" stroke="#52705e" stroke-width="2" marker-end="url(#arrow)"/><path d="M482 311 L527 311" stroke="#52705e" stroke-width="2" marker-end="url(#arrow)"/><path d="M632 192 V230 H382 V265" fill="none" stroke="#52705e" stroke-width="2" marker-end="url(#arrow)"/><rect x="532" y="420" width="200" height="82" rx="10" fill="#eef4ed" stroke="#afc1b1"/><text x="547" y="450" class="m">模型生成回答</text><text x="547" y="477" class="s">核对断言与引用</text><path d="M632 352 L632 415" stroke="#52705e" stroke-width="2" marker-end="url(#arrow)"/><text x="32" y="445" class="s">分别检查：资料是否完整、检索是否找对，</text><text x="32" y="475" class="s">以及回答是否被引用片段支持。</text></svg>